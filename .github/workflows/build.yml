name: 构建桌面安装包

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            runner: macos-15
            platform: macos
            artifact_name: AncientMedicalTTS-macos-arm64
            bundle_args: app
          - name: macOS Intel x64
            runner: macos-15-intel
            platform: macos
            artifact_name: AncientMedicalTTS-macos-x64
            bundle_args: app
          - name: Windows x64
            runner: windows-2025
            platform: windows
            artifact_name: AncientMedicalTTS-windows-x64
            bundle_args: nsis,msi

    steps:
      - name: 获取源码
        uses: actions/checkout@v5

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - name: 设置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: 设置 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 设置 Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 设置 uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.12"

      - name: 安装 JavaScript 与 Worker 依赖
        run: |
          pnpm install --frozen-lockfile
          uv sync --project worker

      - name: 检查发布更新签名密钥
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "发布构建缺少 TAURI_SIGNING_PRIVATE_KEY，无法生成可验证的在线更新包。"
            exit 1
          fi

      - name: 安装 FFmpeg（macOS runner）
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          brew install ffmpeg
          echo "ANCIENT_MEDICAL_TTS_FFMPEG=$(brew --prefix ffmpeg)/bin/ffmpeg" >> "$GITHUB_ENV"

      - name: 安装 FFmpeg（Windows runner）
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          # Get-Command resolves to Chocolatey's shim in C:\ProgramData\Chocolatey\bin.
          # A shim is not portable and cannot be shipped to end users. Resolve the
          # real executable from the package tools directory instead.
          $toolsDir = Join-Path $env:ChocolateyInstall "lib\ffmpeg\tools"
          $ffmpeg = Get-ChildItem -Path $toolsDir -Filter ffmpeg.exe -Recurse -File |
            Where-Object { $_.FullName -notlike "$(Join-Path $env:ChocolateyInstall 'bin')\*" } |
            Select-Object -First 1
          if (-not $ffmpeg) {
            throw "找不到 Chocolatey FFmpeg package 中的真实 ffmpeg.exe: $toolsDir"
          }
          if ($ffmpeg.Length -lt 1MB) {
            throw "解析到的 FFmpeg 文件过小，疑似 Chocolatey shim: $($ffmpeg.FullName)"
          }
          "ANCIENT_MEDICAL_TTS_FFMPEG=$($ffmpeg.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "使用真实 FFmpeg binary: $($ffmpeg.FullName)"

      - name: 检查 FFmpeg 与 MP3 编码器（macOS）
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          "$ANCIENT_MEDICAL_TTS_FFMPEG" -version | sed -n '1p'
          "$ANCIENT_MEDICAL_TTS_FFMPEG" -hide_banner -encoders 2>/dev/null | grep -F libmp3lame

      - name: 检查 FFmpeg 与 MP3 编码器（Windows）
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          & $env:ANCIENT_MEDICAL_TTS_FFMPEG -version | Select-Object -First 1
          & $env:ANCIENT_MEDICAL_TTS_FFMPEG -hide_banner -encoders 2>$null | Select-String libmp3lame

      - name: 准备 FFmpeg sidecar（Windows）
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          node scripts/prepare-ffmpeg.mjs
          pnpm worker:build

      - name: 验证 Windows 多段音频拼接
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          RUN_FFMPEG_INTEGRATION: "1"
        run: cargo test --manifest-path src-tauri/Cargo.toml services::export_service::tests::ffmpeg_integration_concat_and_mp3_are_opt_in -- --exact

      - name: 规范化 Windows MSI 版本
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version.split('-')[0]"
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "无法从 package.json 得到有效的 MSI 版本: $version"
          }
          "ANCIENT_MEDICAL_TTS_BUNDLE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 构建 Tauri 安装包
        env:
          CI: "true"
          ANCIENT_MEDICAL_TTS_ADHOC_SIGN: ${{ matrix.platform == 'macos' && '1' || '0' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri:build --bundles ${{ matrix.bundle_args }}

      - name: 打包 macOS App
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent \
            src-tauri/target/release/bundle/macos/AncientMedicalTTS.app \
            "release/${{ matrix.artifact_name }}.app.zip"
          updater_archive="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          if [[ -n "$updater_archive" && -f "$updater_archive.sig" ]]; then
            cp "$updater_archive" "release/${{ matrix.artifact_name }}.app.tar.gz"
            cp "$updater_archive.sig" "release/${{ matrix.artifact_name }}.app.tar.gz.sig"
          fi

      - name: 收集 Windows 安装包
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item src-tauri/target/release/bundle/msi/*.msi release/
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe release/
          Get-ChildItem src-tauri/target/release/bundle/msi,src-tauri/target/release/bundle/nsis -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like '*.nsis.zip' -or $_.Name -like '*.nsis.zip.sig' } |
            Copy-Item -Destination release/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: 上传 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v5
        with:
          path: release
          merge-multiple: true

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_args=(--title "AncientMedicalTTS ${tag}" --generate-notes)
            if [[ "$tag" == *-* ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" "${release_args[@]}"
          fi
          arm_archive="release/AncientMedicalTTS-macos-arm64.app.tar.gz"
          arm_signature="${arm_archive}.sig"
          intel_archive="release/AncientMedicalTTS-macos-x64.app.tar.gz"
          intel_signature="${intel_archive}.sig"
          windows_archive="$(find release -maxdepth 1 -type f -iname '*.nsis.zip' -print -quit)"
          windows_signature="${windows_archive}.sig"
          if [[ -f "$arm_archive" && -f "$arm_signature" && -f "$intel_archive" && -f "$intel_signature" && -n "$windows_archive" && -f "$windows_signature" ]]; then
            jq -n \
              --arg version "${tag#v}" \
              --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg arm_url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/$(basename "$arm_archive")" \
              --arg arm_sig "$(cat "$arm_signature")" \
              --arg intel_url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/$(basename "$intel_archive")" \
              --arg intel_sig "$(cat "$intel_signature")" \
              --arg windows_url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/$(basename "$windows_archive")" \
              --arg windows_sig "$(cat "$windows_signature")" \
              '{version:$version,pub_date:$pub_date,notes:"AncientMedicalTTS 更新",platforms:{"darwin-aarch64":{url:$arm_url,signature:$arm_sig},"darwin-x86_64":{url:$intel_url,signature:$intel_sig},"windows-x86_64":{url:$windows_url,signature:$windows_sig}}}' \
              > release/latest.json
          else
            echo "未找到完整的更新包或签名，跳过 latest.json；请检查更新签名密钥与打包产物。"
          fi
          gh release upload "$tag" release/* --repo "$GITHUB_REPOSITORY" --clobber
          if [[ -f release/latest.json ]]; then
            encoded_manifest="$(base64 -w0 release/latest.json)"
            manifest_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/site/latest.json?ref=main" --jq .sha 2>/dev/null || true)"
            if [[ -n "$manifest_sha" ]]; then
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/site/latest.json" \
                -f message="chore: update online update manifest for ${tag}" \
                -f branch=main \
                -f content="$encoded_manifest" \
                -f sha="$manifest_sha" >/dev/null
            else
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/site/latest.json" \
                -f message="chore: add online update manifest for ${tag}" \
                -f branch=main \
                -f content="$encoded_manifest" >/dev/null
            fi
            echo "已同步在线更新清单到 main: site/latest.json"
          fi
