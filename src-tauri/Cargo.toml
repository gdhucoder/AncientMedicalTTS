[package]
name = "ancient-medical-tts"
version = "0.1.0"
description = "Ancient Medical TTS desktop application"
authors = ["AncientMedicalTTS"]
edition = "2021"

[lib]
name = "ancient_medical_tts_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio-rustls", "migrate", "uuid"] }
tauri = { version = "=2.12.0", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
time = { version = "0.3", features = ["formatting"] }
unicode-segmentation = "1.13"
uuid = { version = "1.18.1", features = ["v7", "serde"] }
tauri-plugin-updater = "=2.12.0"
tauri-plugin-process = "=2.3.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "=0.3.2", features = ["NSResponder", "NSWindow", "NSWindowRestoration"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
