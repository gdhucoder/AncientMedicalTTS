[package]
name = "ancient-medical-tts"
version = "0.1.0-rc1"
description = "Ancient Medical TTS desktop application"
authors = ["AncientMedicalTTS"]
edition = "2021"

[lib]
name = "ancient_medical_tts_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio-rustls", "migrate", "uuid"] }
tauri = { version = "2.8.4", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
time = { version = "0.3", features = ["formatting"] }
unicode-segmentation = "1.13"
uuid = { version = "1.18.1", features = ["v7", "serde"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
