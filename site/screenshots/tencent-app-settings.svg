<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">AncientMedicalTTS TTS 设置示意图</title>
  <desc id="desc">AncientMedicalTTS 中填写腾讯云 SecretId 和 SecretKey 并测试连接。</desc>
  <rect width="1280" height="760" fill="#f4f1e9"/>
  <rect x="0" y="0" width="1280" height="72" fill="#fbfaf6"/>
  <rect x="36" y="17" width="39" height="39" rx="10" fill="#365b4d"/><text x="50" y="47" font-family="Georgia, serif" font-size="27" fill="#ffffff">古</text>
  <text x="94" y="34" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#1f2b27">AncientMedicalTTS</text>
  <text x="94" y="54" font-family="Arial, sans-serif" font-size="12" fill="#68726c">TTS 设置</text>
  <rect x="0" y="72" width="1280" height="688" fill="#f8f6f0"/>
  <text x="74" y="136" font-family="Arial, sans-serif" font-size="13" letter-spacing="3" font-weight="700" fill="#bd8b40">TTS SETTINGS</text>
  <text x="74" y="190" font-family="Georgia, serif" font-size="39" font-weight="700" fill="#1f2b27">腾讯云语音合成</text>
  <rect x="74" y="230" width="540" height="430" rx="16" fill="#ffffff" stroke="#dfe3da"/>
  <text x="108" y="276" font-family="Arial, sans-serif" font-size="13" letter-spacing="2" font-weight="700" fill="#8a9188">腾讯云凭证</text>
  <text x="108" y="330" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#34433c">SecretId</text>
  <rect x="108" y="348" width="470" height="54" rx="9" fill="#fbfaf6" stroke="#d7ddd4"/>
  <text x="130" y="382" font-family="Arial, sans-serif" font-size="16" fill="#9aa39b">粘贴 SecretId</text>
  <text x="108" y="444" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#34433c">SecretKey</text>
  <rect x="108" y="462" width="470" height="54" rx="9" fill="#fbfaf6" stroke="#d7ddd4"/>
  <text x="130" y="496" font-family="Arial, sans-serif" font-size="16" fill="#9aa39b">粘贴 SecretKey</text>
  <rect x="108" y="558" width="154" height="51" rx="10" fill="#365b4d"/>
  <text x="143" y="591" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">保存凭证</text>
  <rect x="646" y="230" width="560" height="430" rx="16" fill="#ffffff" stroke="#dfe3da"/>
  <text x="680" y="276" font-family="Arial, sans-serif" font-size="13" letter-spacing="2" font-weight="700" fill="#8a9188">连接检查</text>
  <text x="680" y="330" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1f2b27">先保存，再测试</text>
  <text x="680" y="374" font-family="Arial, sans-serif" font-size="15" fill="#68726c">保存凭证后，点击测试连接确认配置有效。</text>
  <rect x="680" y="438" width="190" height="52" rx="10" fill="#edf3ed" stroke="#bdcdbf"/>
  <text x="728" y="471" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#365b4d">测试连接</text>
  <circle cx="700" cy="558" r="8" fill="#4d9a70"/><text x="720" y="565" font-family="Arial, sans-serif" font-size="16" fill="#4d8064">连接成功后即可生成语音</text>
</svg>
