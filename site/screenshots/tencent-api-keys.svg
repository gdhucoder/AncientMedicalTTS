<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">腾讯云 API 密钥管理示意图</title>
  <desc id="desc">腾讯云访问管理中的 API 密钥管理和新建密钥按钮。</desc>
  <rect width="1280" height="760" fill="#f4f6f8"/>
  <rect width="1280" height="64" fill="#ffffff"/>
  <circle cx="34" cy="32" r="10" fill="#2f73d9"/><text x="54" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#15243a">腾讯云控制台</text>
  <text x="1042" y="39" font-family="Arial, sans-serif" font-size="14" fill="#657184">访问管理</text>
  <rect x="0" y="64" width="220" height="696" fill="#1d2939"/>
  <text x="28" y="106" font-family="Arial, sans-serif" font-size="13" fill="#aab5c4">访问管理</text>
  <rect x="15" y="132" width="190" height="44" rx="7" fill="#2c5d98"/>
  <text x="38" y="160" font-family="Arial, sans-serif" font-size="16" fill="#ffffff">API 密钥管理</text>
  <text x="38" y="212" font-family="Arial, sans-serif" font-size="15" fill="#9eabba">用户列表</text>
  <text x="38" y="256" font-family="Arial, sans-serif" font-size="15" fill="#9eabba">权限策略</text>
  <rect x="220" y="64" width="1060" height="696" fill="#f7f9fb"/>
  <text x="260" y="118" font-family="Arial, sans-serif" font-size="14" fill="#7f8a9a">访问管理 / API 密钥管理</text>
  <text x="260" y="174" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#182433">API 密钥管理</text>
  <rect x="1004" y="138" width="174" height="50" rx="8" fill="#2f73d9"/>
  <text x="1041" y="171" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">新建密钥</text>
  <rect x="260" y="224" width="918" height="82" rx="10" fill="#fff8e8" stroke="#f0d28d"/>
  <text x="286" y="258" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#805c16">安全提示</text>
  <text x="286" y="285" font-family="Arial, sans-serif" font-size="14" fill="#866f42">SecretKey 创建后只完整显示一次，请立即复制并安全保存。</text>
  <rect x="260" y="338" width="918" height="274" rx="10" fill="#ffffff" stroke="#e1e6ed"/>
  <rect x="260" y="338" width="918" height="58" fill="#f3f6f9"/>
  <text x="292" y="374" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#536174">SecretId</text>
  <text x="570" y="374" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#536174">SecretKey</text>
  <text x="1018" y="374" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#536174">状态</text>
  <line x1="260" y1="454" x2="1178" y2="454" stroke="#e8edf3"/>
  <text x="292" y="430" font-family="Arial, sans-serif" font-size="15" fill="#8793a4">创建后复制</text>
  <text x="570" y="430" font-family="Arial, sans-serif" font-size="15" fill="#8793a4">创建后复制</text>
  <text x="1018" y="430" font-family="Arial, sans-serif" font-size="15" fill="#4b9b70">启用</text>
  <text x="292" y="526" font-family="Arial, sans-serif" font-size="14" fill="#a0a9b6">示例：请使用你自己的密钥，不要照抄截图内容</text>
</svg>
